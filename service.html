<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAQIM SVGA - Custom Service Request</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .service-container {
            max-width: 750px;
            margin: 40px auto;
            padding: 35px;
            background: #14162b;
            border: 1px solid #202347;
            border-radius: 12px;
        }
        .service-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .service-header h1 {
            color: #ffaa00;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .service-header p {
            color: #b0b3c6;
            font-size: 13px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #b0b3c6;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: #1b1e38;
            border: 1px solid #2b2f63;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .form-group textarea {
            resize: vertical;
            height: 120px;
        }
        .submit-request-btn {
            background: #ffaa00;
            color: #0b0b16;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-request-btn:hover {
            background: #e59900;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo-area">
            <img src="assets/logo.png" alt="Logo" class="logo-img">
            <span class="brand-title">SAQIM SVGA</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="service.html" class="active">Service & Custom Request</a>
        </nav>
        <div class="search-user">
            <a href="index.html" class="login-btn" style="background:#3b3edc; text-decoration:none;">Back to Store</a>
        </div>
    </header>

    <!-- Service Form Container -->
    <div class="service-container">
        <div class="service-header">
            <h1>Request a Custom Resource / Design</h1>
            <p>Do you have a specific idea for Voice Chat applications? Fill out the form below with all the details, and your request will be sent directly to our management team at <strong>abdelhakimsaqim@gmail.com</strong>.</p>
        </div>

        <form id="customServiceForm">
            <div class="form-group">
                <label>Your Full Name / Username</label>
                <input type="text" id="clientName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="clientEmail" placeholder="example@domain.com" required>
            </div>

            <div class="form-group">
                <label>Service / Asset Type</label>
                <select id="serviceType" class="country-select" style="background:#1b1e38; border:1px solid #2b2f63; color:#fff; padding:12px; border-radius:6px; width:100%;">
                    <option value="Animated Gift">Animated Gift (هدية متحركة)</option>
                    <option value="VIP Badge">VIP Badge (شارة فخامة)</option>
                    <option value="Mic Position">Mic Position (موقع الميكروفون)</option>
                    <option value="Avatar Frame">Avatar Frame (إطار الأفاتار)</option>
                    <option value="Homepage Decoration">Homepage Decoration (ديكور الصفحة الرئيسية)</option>
                    <option value="Other Custom Request">Other Custom Request (طلب مخصص آخر)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Detailed Description (What do you want us to create?)</label>
                <textarea id="clientDetails" placeholder="Describe your design, colors, effects, format preferences (SVGA, MP4, etc.), and any specific details..." required></textarea>
            </div>

            <button type="submit" class="submit-request-btn">
                <i class="fa-solid fa-paper-plane"></i> Submit Request
            </button>
        </form>
    </div>

    <!-- Script to Handle Form & Send WhatsApp / Firebase / Email integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDe-I_yBX3T1oGmKB3FdmK4kRnR-s-c6Pw",
          authDomain: "saqim-svga-stor.firebaseapp.com",
          databaseURL: "https://saqim-svga-stor-default-rtdb.firebaseio.com",
          projectId: "saqim-svga-stor",
          storageBucket: "saqim-svga-stor.firebasestorage.app",
          messagingSenderId: "355711087347",
          appId: "1:355711087347:web:4135b774d3d6e7aad7fd86",
          measurementId: "G-KHKR569DBH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const customServiceForm = document.getElementById('customServiceForm');
        const clientName = document.getElementById('clientName');
        const clientEmail = document.getElementById('clientEmail');
        const serviceType = document.getElementById('serviceType');
        const clientDetails = document.getElementById('clientDetails');

        customServiceForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = clientName.value;
            const email = clientEmail.value;
            const type = serviceType.value;
            const details = clientDetails.value;

            try {
                // 1. حفظ الطلب في قاعدة البيانات (Firebase Database) تحت جدول customRequests باش يبان في لوحة القيادة (Dashboard) ديالك
                const requestsRef = ref(db, 'customRequests');
                const newReqRef = push(requestsRef);
                await set(newReqRef, {
                    name: name,
                    email: email,
                    serviceType: type,
                    details: details,
                    createdAt: new Date().toISOString()
                });

                // 2. صياغة رسالة واتساب فورية لضمان توصلك بالطلب في نفس اللحظة مع فتح الإيميل
                let message = `🛎️ *New Custom Service Request*\n\n`;
                message += `👤 *Name:* ${name}\n`;
                message += `📧 *Email:* ${email}\n`;
                message += `🎁 *Type:* ${type}\n`;
                message += `📝 *Details:* ${details}\n`;

                const whatsappUrl = `https://wa.me/212660010075?text=${encodeURIComponent(message)}`;
                window.open(whatsappUrl, '_blank');

                alert("Your custom request has been successfully submitted and saved! We will also review it for abdelhakimsaqim@gmail.com");
                customServiceForm.reset();

            } catch (error) {
                console.error("Error submitting request: ", error);
                alert("Failed to submit request. Please try again.");
            }
        });
    </script>
</body>
</html>
