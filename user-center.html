<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAQIM SVGA - User Center</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .user-center-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: #14162b;
            border: 1px solid #202347;
            border-radius: 12px;
        }
        .user-profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #1b1e38;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #2b2f63;
            margin-bottom: 30px;
        }
        .user-avatar-icon {
            width: 70px;
            height: 70px;
            background: #ffaa00;
            color: #0b0b16;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: bold;
        }
        .user-meta h2 {
            color: #fff;
            font-size: 20px;
            margin-bottom: 5px;
        }
        .user-meta p {
            color: #b0b3c6;
            font-size: 13px;
            margin-bottom: 3px;
        }
        .user-meta span {
            color: #ffaa00;
            font-size: 12px;
        }
        .section-title {
            color: #ffaa00;
            font-size: 16px;
            margin-bottom: 15px;
            border-bottom: 1px solid #202347;
            padding-bottom: 8px;
        }
        .user-orders-box, .user-cart-history {
            background: #0f1020;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #1f2242;
            margin-bottom: 25px;
            max-height: 300px;
            overflow-y: auto;
        }
        .order-item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #171932;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .order-info h4 {
            color: #fff;
            font-size: 13px;
            margin-bottom: 3px;
        }
        .order-info p {
            color: #8c90ad;
            font-size: 11px;
        }
        .order-price {
            color: #ffaa00;
            font-weight: bold;
            font-size: 13px;
        }
        .logout-btn-container {
            text-align: right;
            margin-top: 20px;
        }
        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo-area">
            <img src="assets/logo.png" alt="Logo" class="logo-img">
            <span class="brand-title">SAQIM SVGA</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="service.html">Service</a>
            <a href="user-center.html" class="active">User Center</a>
        </nav>
        <div class="search-user">
            <a href="index.html" class="login-btn" style="background:#3b3edc; text-decoration:none;">Back to Store</a>
        </div>
    </header>

    <!-- Main User Center Content -->
    <div class="user-center-container">
        <!-- Profile Header -->
        <div class="user-profile-header">
            <div class="user-avatar-icon" id="userInitial">U</div>
            <div class="user-meta">
                <h2 id="userNameDisplay">Loading User...</h2>
                <p id="userEmailDisplay">email@domain.com</p>
                <p>Account UID: <span id="userUidDisplay">---</span></p>
            </div>
        </div>

        <!-- Saved Cart Items Section -->
        <h3 class="section-title"><i class="fa-solid fa-cart-shopping"></i> Your Saved Cart Items</h3>
        <div class="user-cart-history" id="userSavedCartList">
            <p style="color:#8c90ad; text-align:center; padding:15px;">Loading saved cart...</p>
        </div>

        <!-- User Orders History -->
        <h3 class="section-title"><i class="fa-solid fa-bag-shopping"></i> Your Submitted Orders</h3>
        <div class="user-orders-box" id="userOrdersList">
            <p style="color:#8c90ad; text-align:center; padding:15px;">Loading orders history...</p>
        </div>

        <!-- Logout Button -->
        <div class="logout-btn-container">
            <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </div>

    <!-- Script to Handle User Authentication, Data & Logout -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDe-I_yBX3T1oGmKB3FdmK4kRnR-s-c6Pw",
          authDomain: "saqim-svga-stor.firebaseapp.com",
          databaseURL: "https://saqim-svga-stor-default-rtdb.firebaseio.com",
          projectId: "saqim-svga-stor",
          storageBucket: "saqim-svga-stor.firebasestorage.app",
          messagingSenderId: "355711087347",
          appId: "1:355711087347:web:4135b774d3d6e7aad7fd86",
          measurementId: "G-KHKR569DBH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        const userInitial = document.getElementById('userInitial');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const userUidDisplay = document.getElementById('userUidDisplay');
        const userSavedCartList = document.getElementById('userSavedCartList');
        const userOrdersList = document.getElementById('userOrdersList');
        const logoutBtn = document.getElementById('logoutBtn');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // عرض بيانات المستخدم
                const name = user.displayName || user.email.split('@')[0];
                userNameDisplay.textContent = name;
                userEmailDisplay.textContent = user.email;
                userUidDisplay.textContent = user.uid;
                userInitial.textContent = name.charAt(0).toUpperCase();

                // 1. جلب السلة المحفوظة للمستخدم
                try {
                    const cartSnap = await get(ref(db, `carts/${user.uid}`));
                    if (cartSnap.exists()) {
                        const items = cartSnap.val() || [];
                        userSavedCartList.innerHTML = "";
                        if (items.length === 0) {
                            userSavedCartList.innerHTML = `<p style="color:#8c90ad; text-align:center; padding:15px;">Your cart is empty.</p>`;
                        } else {
                            items.forEach(item => {
                                userSavedCartList.innerHTML += `
                                    <div class="order-item-card">
                                        <div style="display:flex; align-items:center; gap:10px;">
                                            <img src="${item.image}" style="width:40px; height:40px; object-fit:cover; border-radius:4px;">
                                            <div>
                                                <h4>${item.title}</h4>
                                                <p>NO: ${item.no}</p>
                                            </div>
                                        </div>
                                        <span class="order-price">${item.price}</span>
                                    </div>`;
                            });
                        }
                    } else {
                        userSavedCartList.innerHTML = `<p style="color:#8c90ad; text-align:center; padding:15px;">Your cart is empty.</p>`;
                    }
                } catch (e) {
                    console.error("Error loading cart", e);
                }

                // 2. جلب الطلبات السابقة للمستخدم
                try {
                    const ordersSnap = await get(ref(db, 'orders'));
                    if (ordersSnap.exists()) {
                        const allOrders = ordersSnap.val();
                        userOrdersList.innerHTML = "";
                        let userHasOrders = false;

                        Object.values(allOrders).forEach(order => {
                            if (order.userId === user.uid) {
                                userHasOrders = true;
                                const dateStr = new Date(order.createdAt).toLocaleString();
                                userOrdersList.innerHTML += `
                                    <div style="background:#171932; padding:12px; border-radius:6px; margin-bottom:10px;">
                                        <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:12px; color:#8c90ad;">
                                            <span>Date: ${dateStr}</span>
                                            <span>Phone: ${order.phone}</span>
                                        </div>
                                        <p style="color:#fff; font-size:13px;">Items count: <strong>${order.items.length} products</strong></p>
                                    </div>`;
                            }
                        });

                        if (!userHasOrders) {
                            userOrdersList.innerHTML = `<p style="color:#8c90ad; text-align:center; padding:15px;">No previous orders found.</p>`;
                        }
                    } else {
                        userOrdersList.innerHTML = `<p style="color:#8c90ad; text-align:center; padding:15px;">No orders found.</p>`;
                    }
                } catch (e) {
                    console.error("Error loading orders", e);
                }

            } else {
                // إذا لم يكن المستخدم مسجلاً الدخول، إعادة توجيهه لصفحة Login
                alert("Please login first to view User Center!");
                window.location.href = "login.html";
            }
        });

        // زر تسجيل الخروج (Logout)
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                alert("Logged out successfully!");
                window.location.href = "login.html";
            } catch (error) {
                console.error("Error signing out: ", error);
            }
        });
    </script>
</body>
</html>
