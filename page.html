<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAQIM SVGA - Banner Event Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- Custom Aniq Toast Notification Style --- */
        #customToast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px);
            visibility: hidden;
            transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s ease;
            pointer-events: none;
        }
        #customToast.error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        #customToast.show {
            opacity: 1;
            transform: translateY(0);
            visibility: visible;
            pointer-events: auto;
        }
        #customToast i {
            font-size: 20px;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo-area">
            <img src="assets/logo.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/40'">
            <span class="brand-title">SAQIM SVGA</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="#" class="active" id="bannerPageTitle">Event Page</a>
        </nav>
        <div class="search-user">
            <!-- Cart Icon & Counter -->
            <button class="cart-icon-btn" id="openCartBtn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cartCount">0</span>
            </button>
            <a href="login.html" class="login-btn">Login</a>
            <a href="index.html" class="login-btn" style="background:#3b3edc; text-decoration:none;">Back to Store</a>
        </div>
    </header>

    <!-- Dynamic Banner Section -->
    <section class="hero-banner" id="bannerContainer">
        <img src="" alt="Banner" class="banner-img active-banner" id="bannerImgTag" onerror="this.src='https://via.placeholder.com/1200x400'">
    </section>

    <!-- Products Grid Section -->
    <main class="products-section">
        <h2 id="productsHeading" style="margin-bottom: 20px; color:#ffaa00; font-size: 20px;">Event Products</h2>
        <div class="products-grid" id="bannerProductsGrid">
            <!-- Dynamic Linked Products -->
        </div>
    </main>

    <!-- Modal for Dynamic Effect Details (Popup) -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal">&times;</button>
            <h2>Dynamic effect details</h2>
            
            <div class="modal-body">
                <!-- Left: Video Preview -->
                <div class="modal-video-container">
                    <video id="modalVideo" controls autoplay loop>
                        <source src="" type="video/mp4" id="modalVideoSource">
                        Your browser does not support the video tag.
                    </video>
                </div>

                <!-- Right: Product Info -->
                <div class="modal-info">
                    <div class="modal-prod-preview">
                        <img src="" alt="Product Image" id="modalProdImg">
                        <div class="modal-prod-text">
                            <h3 id="modalProdTitle">Product Title</h3>
                            <p id="modalProdNo">NO.26598</p>
                            <span class="tag" id="modalProdTag">lovers</span>
                        </div>
                    </div>
                    
                    <p class="duration-text">Duration: <span id="modalDuration">8s</span></p>
                    <p class="price-text" id="modalPrice">$**</p>

                    <div class="modal-buttons">
                        <button class="add-to-cart-btn" id="addToCartBtn"><i class="fa-solid fa-cart-shopping"></i> Add to Cart</button>
                    </div>

                    <p class="info-note">All gifts support SVGA, VAP, MP4, PAG, JSON, WEBP, MOV formats.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- CART & CHECKOUT MODAL -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-content cart-modal-content">
            <button class="close-modal" id="closeCartModal">&times;</button>
            <h2><i class="fa-solid fa-cart-shopping"></i> Salat Talabat (Cart & Checkout)</h2>
            
            <div class="cart-container-grid">
                <div class="cart-items-list" id="cartItemsList"></div>

                <div class="checkout-form-box">
                    <h3>Complete Your Order</h3>
                    <form id="checkoutForm">
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="clientEmail" placeholder="example@domain.com" required>
                        </div>

                        <div class="form-group">
                            <label>Phone Number</label>
                            <div class="phone-input-group">
                                <select id="countryCode" class="country-select">
                                    <option value="+212">🇲🇦 +212 (Morocco)</option>
                                    <option value="+218">🇱🇾 +218 (Libya)</option>
                                    <option value="+966">🇸🇦 +966 (KSA)</option>
                                    <option value="+971">🇦🇪 +971 (UAE)</option>
                                    <option value="+20">🇪🇬 +20 (Egypt)</option>
                                    <option value="+33">🇫🇷 +33 (France)</option>
                                    <option value="+1">🇺🇸 +1 (USA)</option>
                                </select>
                                <input type="tel" id="clientPhone" placeholder="660010075" required>
                            </div>
                        </div>

                        <button type="submit" class="whatsapp-checkout-btn">
                            <i class="fa-brands fa-whatsapp"></i> Confirm & Send via WhatsApp
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Toast Notification Element -->
    <div id="customToast">
        <i id="toastIcon" class="fa-solid fa-circle-check"></i>
        <div>
            <h4 id="toastTitle" style="font-size:14px; margin:0; color:#fff;">Notice</h4>
            <p id="toastMsg" style="font-size:12px; margin:3px 0 0; color:#e2e8f0;"></p>
        </div>
    </div>

    <!-- Script to Load Banner Page Data & Persistent Cart Sync -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDe-I_yBX3T1oGmKB3FdmK4kRnR-s-c6Pw",
          authDomain: "saqim-svga-stor.firebaseapp.com",
          databaseURL: "https://saqim-svga-stor-default-rtdb.firebaseio.com",
          projectId: "saqim-svga-stor",
          storageBucket: "saqim-svga-stor.firebasestorage.app",
          messagingSenderId: "355711087347",
          appId: "1:355711087347:web:4135b774d3d6e7aad7fd86",
          measurementId: "G-KHKR569DBH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');

        const bannerImgTag = document.getElementById('bannerImgTag');
        const bannerPageTitle = document.getElementById('bannerPageTitle');
        const productsHeading = document.getElementById('productsHeading');
        const bannerProductsGrid = document.getElementById('bannerProductsGrid');
        
        const productModal = document.getElementById('productModal');
        const closeModal = document.getElementById('closeModal');
        const modalVideo = document.getElementById('modalVideo');
        const modalVideoSource = document.getElementById('modalVideoSource');
        const modalProdImg = document.getElementById('modalProdImg');
        const modalProdTitle = document.getElementById('modalProdTitle');
        const modalProdNo = document.getElementById('modalProdNo');
        const modalProdTag = document.getElementById('modalProdTag');
        const modalDuration = document.getElementById('modalDuration');
        const modalPrice = document.getElementById('modalPrice');
        const addToCartBtn = document.getElementById('addToCartBtn');

        const openCartBtn = document.getElementById('openCartBtn');
        const cartModal = document.getElementById('cartModal');
        const closeCartModal = document.getElementById('closeCartModal');
        const cartCount = document.getElementById('cartCount');
        const cartItemsList = document.getElementById('cartItemsList');
        const checkoutForm = document.getElementById('checkoutForm');
        const clientEmail = document.getElementById('clientEmail');
        const countryCode = document.getElementById('countryCode');
        const clientPhone = document.getElementById('clientPhone');

        let cartItems = [];
        let currentProduct = null;
        let currentUser = null;

        let toastTimer = null;

        window.showToast = function(title, message, type = "success") {
            const toast = document.getElementById('customToast');
            const toastTitle = document.getElementById('toastTitle');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            if (toast && toastMsg) {
                toastTitle.textContent = title || "Notice";
                toastMsg.textContent = message;
                
                if (type === "error") {
                    toast.className = "error show";
                    if (toastIcon) toastIcon.className = "fa-solid fa-triangle-exclamation";
                } else {
                    toast.className = "show";
                    if (toastIcon) toastIcon.className = "fa-solid fa-circle-check";
                }

                if (toastTimer) clearTimeout(toastTimer);

                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            const loginBtn = document.querySelector('.login-btn');
            if (user) {
                currentUser = user;
                if (loginBtn && loginBtn.textContent === "Login") {
                    loginBtn.textContent = user.displayName || user.email.split('@')[0];
                    loginBtn.style.background = "#25d366";
                    loginBtn.setAttribute('href', '#');
                }
                await loadUserCart(user.uid);
            } else {
                currentUser = null;
                cartItems = [];
                updateCartUI();
                if (loginBtn && loginBtn.textContent !== "Login") {
                    loginBtn.textContent = "Login";
                    loginBtn.style.background = "#4f46e5";
                    loginBtn.setAttribute('href', 'login.html');
                }
            }
        });

        async function loadUserCart(userId) {
            try {
                const snap = await get(ref(db, `carts/${userId}`));
                cartItems = snap.exists() ? (snap.val() || []) : [];
                updateCartUI();
            } catch (error) {
                console.error("Error loading cart:", error);
            }
        }

        async function saveCartToFirebase() {
            if (currentUser) {
                try {
                    await set(ref(db, `carts/${currentUser.uid}`), cartItems);
                } catch (error) {
                    console.error("Error saving cart:", error);
                }
            }
        }

        async function loadBannerPage() {
            if (!slug) {
                bannerProductsGrid.innerHTML = `<p style="color:red; text-align:center; grid-column:1/-1;">Error: No page slug specified!</p>`;
                return;
            }

            try {
                const bannersSnap = await get(ref(db, 'banners'));
                if (bannersSnap.exists()) {
                    const banners = Object.values(bannersSnap.val());
                    const currentBanner = banners.find(b => b.slug === slug);
                    if (currentBanner) {
                        bannerImgTag.src = currentBanner.image;
                        bannerPageTitle.textContent = currentBanner.title;
                        productsHeading.textContent = `Products for: ${currentBanner.title}`;
                    }
                }

                const prodsSnap = await get(ref(db, 'bannerProducts'));
                bannerProductsGrid.innerHTML = "";

                if (prodsSnap.exists()) {
                    const productsData = prodsSnap.val();
                    const filteredProducts = Object.values(productsData).filter(p => p.slug === slug);

                    if (filteredProducts.length > 0) {
                        filteredProducts.forEach(prod => {
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            
                            // تم إضافة عنصر الفيديو هنا ليعمل عند الـ Hover تماماً مثل الصفحة الرئيسية
                            card.innerHTML = `
                                <div class="product-img-container">
                                    <img src="${prod.image}" alt="${prod.title}" onerror="this.src='https://via.placeholder.com/150'">
                                    <video src="${prod.video}" muted loop preload="none"></video>
                                </div>
                                <div class="product-details">
                                    <h4 class="product-title">${prod.title}</h4>
                                    <p class="product-subtitle">${prod.subtitle || prod.tag || 'gift'}</p>
                                    <div class="product-footer">
                                        <span>${prod.no}</span>
                                        <span class="product-price">${prod.price.toString().startsWith('$') ? prod.price : '$' + prod.price}</span>
                                    </div>
                                </div>
                            `;

                            // تفعيل تشغيل الفيديو عند تمرير الماوس (Hover) وإيقافه عند الخروج
                            const vid = card.querySelector('video');
                            card.addEventListener('mouseenter', () => {
                                vid.play().catch(e => console.log("Autoplay prevented:", e));
                            });

                            card.addEventListener('mouseleave', () => {
                                vid.pause();
                                vid.currentTime = 0;
                            });

                            card.addEventListener('click', () => {
                                currentProduct = prod;
                                modalProdTitle.textContent = prod.title;
                                modalProdNo.textContent = prod.no;
                                modalProdTag.textContent = prod.tag || "gift";
                                modalDuration.textContent = prod.duration || "2s";
                                modalPrice.textContent = prod.price;
                                modalProdImg.src = prod.image;
                                
                                modalVideoSource.src = prod.video;
                                modalVideo.load();
                                modalVideo.play().catch(e => console.log("Video play error:", e));
                                
                                productModal.classList.add('active');
                            });

                            bannerProductsGrid.appendChild(card);
                        });
                    } else {
                        bannerProductsGrid.innerHTML = `<p style="color:#8c90ad; text-align:center; grid-column:1/-1; padding:30px;">No products linked to this banner page yet.</p>`;
                    }
                }
            } catch (error) {
                console.error("Error loading page data:", error);
            }
        }

        if (addToCartBtn) {
            addToCartBtn.onclick = async () => {
                if (!currentProduct) return;
                
                if (!currentUser) {
                    showToast("Login Required", "Please login first to save items to your cart!", "error");
                    setTimeout(() => { window.location.href = "login.html"; }, 1500);
                    return;
                }

                const isAlreadyInCart = cartItems.some(item => item.no === currentProduct.no);
                if (isAlreadyInCart) {
                    showToast("Notice", "هذا المنتج موجود بالفعل في السلة الخاصة بك!", "error");
                    productModal.classList.remove('active');
                    modalVideo.pause();
                    return;
                }

                cartItems.push(currentProduct);
                updateCartUI();
                await saveCartToFirebase();

                showToast("Added to Cart", "Product added to cart successfully!");
                productModal.classList.remove('active');
                modalVideo.pause();
            };
        }

        function updateCartUI() {
            if (!cartCount || !cartItemsList) return;
            cartCount.textContent = cartItems.length;
            cartItemsList.innerHTML = "";

            if (cartItems.length === 0) {
                cartItemsList.innerHTML = `<p style="color:#8c90ad; text-align:center; padding:20px;">Your cart is empty.</p>`;
                return;
            }

            cartItems.forEach((item, index) => {
                cartItemsList.innerHTML += `
                    <div class="cart-item-card">
                        <div class="cart-item-info">
                            <img src="${item.image}">
                            <div><h4>${item.title}</h4><p>${item.price} - ${item.no}</p></div>
                        </div>
                        <button class="remove-cart-item" data-index="${index}"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
            });

            document.querySelectorAll('.remove-cart-item').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const idx = e.currentTarget.getAttribute('data-index');
                    cartItems.splice(idx, 1);
                    updateCartUI();
                    await saveCartToFirebase();
                    showToast("Removed", "Item removed from cart.");
                });
            });
        }

        if (openCartBtn && cartModal && closeCartModal) {
            openCartBtn.addEventListener('click', () => cartModal.classList.add('active'));
            closeCartModal.addEventListener('click', () => cartModal.classList.remove('active'));
        }

        if (checkoutForm) {
            checkoutForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (cartItems.length === 0) {
                    showToast("Empty Cart", "Please add items to your cart first!", "error");
                    return;
                }

                const email = clientEmail.value;
                const phone = countryCode.value + clientPhone.value;

                let message = `🛒 *New Order / Request (Banner Page)*\n\n📧 *Email:* ${email}\n📱 *Phone:* ${phone}\n`;
                if (currentUser) message += `👤 *UID:* ${currentUser.uid}\n`;
                message += `\n📦 *Products:*\n`;
                cartItems.forEach((item, i) => { message += `${i + 1}. ${item.title} (${item.no}) - ${item.price}\n`; });

                try {
                    await push(ref(db, 'orders'), {
                        userId: currentUser ? currentUser.uid : "Guest",
                        email, phone, items: cartItems, createdAt: new Date().toISOString()
                    });
                    window.open(`https://wa.me/212660010075?text=${encodeURIComponent(message)}`, '_blank');
                    
                    cartItems = [];
                    updateCartUI();
                    await saveCartToFirebase();

                    cartModal.classList.remove('active');
                    checkoutForm.reset();
                    showToast("Order Confirmed!", "Order submitted and saved successfully!");
                } catch (error) {
                    console.error("Error saving order: ", error);
                    showToast("Error", "Failed to submit order.", "error");
                }
            });
        }

        if (closeModal) {
            closeModal.addEventListener('click', () => {
                productModal.classList.remove('active');
                modalVideo.pause();
            });
        }

        window.addEventListener('click', (e) => {
            if (e.target === productModal) { productModal.classList.remove('active'); modalVideo.pause(); }
            if (e.target === cartModal) { cartModal.classList.remove('active'); }
        });

        loadBannerPage();
    </script>
</body>
</html>
