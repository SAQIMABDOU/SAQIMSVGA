<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVGA.WANG - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0b0b16;
            color: #fff;
        }
        .auth-card {
            width: 400px;
            max-width: 90%;
            background: #14162b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #202347;
        }
        .auth-card h2 {
            color: #ffaa00;
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            color: #b0b3c6;
            font-size: 12px;
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            background: #1b1e38;
            border: 1px solid #2b2f63;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background: #4338ca;
        }
        
        /* زر Google Login الجديد */
        .google-btn {
            width: 100%;
            padding: 11px;
            background: #ffffff;
            color: #333333;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }
        .google-btn:hover {
            background: #f1f1f1;
        }
        .google-btn img {
            width: 18px;
            height: 18px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 15px 0;
            color: #8c90ad;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #2b2f63;
        }
        .divider::before {
            margin-right: 10px;
        }
        .divider::after {
            margin-left: 10px;
        }

        .auth-links {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #8c90ad;
        }
        .auth-links a {
            color: #ffaa00;
            text-decoration: none;
        }
        .back-store {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
        }
        .back-store a {
            color: #b0b3c6;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Login to SAQIM SVGA</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="example@domain.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="********" required>
            </div>
            <button type="submit" class="submit-btn">Login</button>
        </form>

        <div class="divider">OR</div>

        <!-- زر تسجيل الدخول بواسطة جوجل (Google Gmail) -->
        <button type="button" id="googleLoginBtn" class="google-btn">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.17 21.31 7.23 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.13 0 9.87 0 12s.43 3.87 1.18 5.4l4.09-3.16z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.69 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            Continue with Google
        </button>

        <div class="auth-links">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
        <div class="back-store">
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Store</a>
        </div>
    </div>

    <!-- Login Logic JS with Firebase Google Auth -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDe-I_yBX3T1oGmKB3FdmK4kRnR-s-c6Pw",
          authDomain: "saqim-svga-stor.firebaseapp.com",
          databaseURL: "https://saqim-svga-stor-default-rtdb.firebaseio.com",
          projectId: "saqim-svga-stor",
          storageBucket: "saqim-svga-stor.firebasestorage.app",
          messagingSenderId: "355711087347",
          appId: "1:355711087347:web:4135b774d3d6e7aad7fd86",
          measurementId: "G-KHKR569DBH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('loginForm');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const googleLoginBtn = document.getElementById('googleLoginBtn');

        // تسجيل الدخول بالإيميل وكلمة السر العادية
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
                alert("Login successful!");
                window.location.href = "index.html";
            } catch (error) {
                alert("Login failed: " + error.message);
            }
        });

        // تسجيل الدخول بحساب Google (Gmail) عبر نافذة منبثقة Popup
        googleLoginBtn.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                alert("Google login successful!");
                window.location.href = "index.html";
            } catch (error) {
                alert("Google login failed: " + error.message);
            }
        });
    </script>
</body>
</html>
