<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVGA.WANG - Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0b0b16;
            color: #fff;
        }
        .auth-card {
            width: 400px;
            background: #14162b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #202347;
        }
        .auth-card h2 {
            color: #ffaa00;
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            color: #b0b3c6;
            font-size: 12px;
            display: block;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 9px;
            background: #1b1e38;
            border: 1px solid #2b2f63;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background: #4338ca;
        }
        .auth-links {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #8c90ad;
        }
        .auth-links a {
            color: #ffaa00;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Create Account</h2>
        <form id="signupForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="signupUsername" placeholder="Your Username" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signupEmail" placeholder="example@domain.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="********" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="signupConfirmPassword" placeholder="********" required>
            </div>
            <button type="submit" class="submit-btn">Sign Up</button>
        </form>
        <div class="auth-links">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <!-- Sign Up Logic JS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDe-I_yBX3T1oGmKB3FdmK4kRnR-s-c6Pw",
          authDomain: "saqim-svga-stor.firebaseapp.com",
          databaseURL: "https://saqim-svga-stor-default-rtdb.firebaseio.com",
          projectId: "saqim-svga-stor",
          storageBucket: "saqim-svga-stor.firebasestorage.app",
          messagingSenderId: "355711087347",
          appId: "1:355711087347:web:4135b774d3d6e7aad7fd86",
          measurementId: "G-KHKR569DBH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const signupForm = document.getElementById('signupForm');
        const signupUsername = document.getElementById('signupUsername');
        const signupEmail = document.getElementById('signupEmail');
        const signupPassword = document.getElementById('signupPassword');
        const signupConfirmPassword = document.getElementById('signupConfirmPassword');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (signupPassword.value !== signupConfirmPassword.value) {
                alert("Passwords do not match!");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, signupEmail.value, signupPassword.value);
                await updateProfile(userCredential.user, {
                    displayName: signupUsername.value
                });

                alert("Account created successfully! Please login.");
                window.location.href = "login.html";
            } catch (error) {
                alert("Sign up failed: " + error.message);
            }
        });
    </script>
</body>
</html>
